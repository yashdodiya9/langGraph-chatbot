services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data # persist chatbot.db across container restarts

  # Uncomment once you migrate from AsyncSqliteSaver to AsyncPostgresSaver
